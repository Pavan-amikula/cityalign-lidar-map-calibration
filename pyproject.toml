[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cityalign-lidar"
version = "0.1.0"
description = "Auditable LiDAR evidence for urban map calibration"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "shapely>=2.1,<3", "flask>=3,<4", "laspy[lazrs]>=2.5,<3", "trimesh>=4,<5", "pyproj>=3.6,<4", "matplotlib>=3.8,<4", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "imageio>=2.34,<3", "imageio-ffmpeg>=0.5,<1", "usd-core>=24"]

[project.scripts]
cityalign = "urban_calibrator.cli:main"

[tool.setuptools.packages.find]
include = ["urban_calibrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
